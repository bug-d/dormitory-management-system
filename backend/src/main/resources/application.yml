server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: dormitory-backend
  # ⭐ 添加这一行：激活开发环境
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  type-aliases-package: com.university.dorm.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: dormitory-system-secret-key-2024
  expiration: 86400000
  header: Authorization
  prefix: Bearer

knife4j:
  enable: true

# ⭐ 添加系统配置
system:
  init-password: 123456
  reset-password: 123456
  semester: 2026-2027-1
  max-dorm-capacity: 6

logging:
  level:
    com.university.dorm: info
    org.springframework.web: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'